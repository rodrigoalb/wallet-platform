# Banco descartável para os testes e2e (dados em memória, porta 5433).
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wallet -d wallet_test']
      interval: 2s
      timeout: 3s
      retries: 20
